name: MeepSheep Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Tests, repository doctor, and workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out event revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Install MCP relay dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run MCP relay integration tests
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Run Wellness Doctor unit tests
        run: python -m unittest discover -s tests -v

      - name: Inspect repository health (read-only)
        run: python scripts/wellness_doctor.py

      - name: Validate GitHub Actions YAML syntax
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.{yml,yaml}").sort.each { |file| YAML.load_file(file); puts "YAML OK: #{file}" }'
