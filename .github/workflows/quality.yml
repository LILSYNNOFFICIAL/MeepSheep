name: MeepSheep Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Tests, repository doctor, and workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out event revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Install MCP relay dependencies
        id: install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run authentication boundary tests
        id: auth
        continue-on-error: true
        run: node --test tests/security-boundary.test.mjs

      - name: Run endpoint security boundary tests
        id: endpoint
        if: always()
        continue-on-error: true
        run: node --test tests/endpoint-security.test.mjs

      - name: Run credential vault boundary tests
        id: vault
        if: always()
        continue-on-error: true
        run: node --test tests/credential-vault.test.mjs

      - name: Run agent registry isolation tests
        id: registry
        if: always()
        continue-on-error: true
        run: node --test tests/agent-registry.test.mjs

      - name: Run secure remote MCP connection tests
        id: remote
        if: always()
        continue-on-error: true
        run: node --test tests/remote-mcp-connection.test.mjs

      - name: Run owner connection lifecycle tests
        id: connection
        if: always()
        continue-on-error: true
        run: node --test tests/agent-connection-manager.test.mjs

      - name: Run task coordinator tests
        id: task
        if: always()
        continue-on-error: true
        run: node --test tests/task-coordinator.test.mjs

      - name: Run task dispatcher tests
        id: dispatcher
        if: always()
        continue-on-error: true
        run: node --test tests/task-dispatcher.test.mjs

      - name: Run MCP relay integration and unit suite
        id: full
        if: always()
        continue-on-error: true
        run: npm test

      - name: Set up Python
        id: python_setup
        if: always()
        continue-on-error: true
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Run Wellness Doctor unit tests
        id: wellness
        if: always()
        continue-on-error: true
        run: python -m unittest discover -s tests -v

      - name: Inspect repository health (read-only)
        id: repo_doctor
        if: always()
        continue-on-error: true
        run: python scripts/wellness_doctor.py

      - name: Validate GitHub Actions YAML syntax
        id: yaml
        if: always()
        continue-on-error: true
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.{yml,yaml}").sort.each { |file| YAML.load_file(file); puts "YAML OK: #{file}" }'

      - name: Verify complete quality gate
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.auth.outcome }}" = "success"
          test "${{ steps.endpoint.outcome }}" = "success"
          test "${{ steps.vault.outcome }}" = "success"
          test "${{ steps.registry.outcome }}" = "success"
          test "${{ steps.remote.outcome }}" = "success"
          test "${{ steps.connection.outcome }}" = "success"
          test "${{ steps.task.outcome }}" = "success"
          test "${{ steps.dispatcher.outcome }}" = "success"
          test "${{ steps.full.outcome }}" = "success"
          test "${{ steps.python_setup.outcome }}" = "success"
          test "${{ steps.wellness.outcome }}" = "success"
          test "${{ steps.repo_doctor.outcome }}" = "success"
          test "${{ steps.yaml.outcome }}" = "success"
