name: Build MeepSheep

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: meepsheep-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install web dependencies
        run: npm install --no-fund
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Lint web application
        run: npm run lint
      - name: Build web application
        run: npm run build
      - name: Test agent policy core
        run: dotnet test agent/MeepSheep.Agent.Core.Tests/MeepSheep.Agent.Core.Tests.csproj --configuration Release
      - name: Build local agent shell
        run: dotnet build agent/MeepSheep.Agent.Host/MeepSheep.Agent.Host.csproj --configuration Release
